<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001C3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copa 2026">
<meta name="description" content="Agenda completa Copa do Mundo FIFA 2026 — baixe para seu calendário">
<title>⚽ Copa do Mundo 2026</title>

<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #020F2A;
    --bg2: #031630;
    --card: #071F3D;
    --border: #0D3060;
    --accent: #C8A84B;
    --accent2: #1A8C4E;
    --text: #E8EFF8;
    --text2: #8AADCF;
    --brazil: #009C3B;
    --italy: #009246;
    --red: #CF3737;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* HEADER */
  header {
    background: linear-gradient(180deg, #010B1F 0%, #021426 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 0;
    position: sticky; top: 0; z-index: 100;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { font-size: 28px; }
  .logo-text h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
  .logo-text p { font-size: 11px; color: var(--text2); }
  .install-btn {
    background: var(--accent); color: #020F2A;
    border: none; border-radius: 8px; padding: 7px 12px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    display: none; /* shown after service worker registers */
  }
  .install-btn.visible { display: block; }

  /* LANG TABS */
  .lang-tabs {
    display: flex; gap: 4px;
  }
  .lang-tab {
    flex: 1; padding: 10px 8px; text-align: center;
    font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; background: transparent; color: var(--text2);
    border-bottom: 3px solid transparent;
    transition: all 0.2s; border-radius: 0;
  }
  .lang-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* DOWNLOAD BAR */
  .download-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .download-bar p { font-size: 12px; color: var(--text2); flex: 1; line-height: 1.4; }
  .dl-btn {
    background: linear-gradient(135deg, #1A8C4E, #0D6B3A);
    color: #fff; border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(26,140,78,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .dl-btn:active { transform: scale(0.97); box-shadow: none; }
  .sub-btn {
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  .sub-btn:active { background: rgba(200,168,75,0.15); }
  .live-badge {
    display: inline-block; background: #cf3737; color: #fff;
    font-size: 10px; font-weight: 800; border-radius: 4px;
    padding: 1px 5px; letter-spacing: 0.5px; animation: pulse 1.2s infinite;
    margin-right: 4px;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .score-badge {
    font-size: 13px; font-weight: 800; color: #fff;
    background: rgba(255,255,255,0.1); border-radius: 6px;
    padding: 2px 8px; min-width: 40px; text-align: center; flex-shrink: 0;
  }
  .score-badge.ft { color: var(--accent2); background: rgba(26,140,78,0.15); }
  .score-badge.live { color: #ff6b6b; background: rgba(207,55,55,0.15); }
  .updated-label {
    font-size: 10px; color: var(--text2); text-align: center;
    padding: 4px 0 0; opacity: 0.7;
  }
  .sub-info {
    font-size: 11px; color: var(--text2); line-height: 1.5;
    background: rgba(200,168,75,0.07); border: 1px solid rgba(200,168,75,0.2);
    border-radius: 8px; padding: 10px 12px; margin-top: 8px;
  }
  .dl-btn span { font-size: 15px; }

  /* FILTER BAR */
  .filter-bar {
    padding: 10px 16px;
    display: flex; gap: 6px; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text2); border-radius: 20px;
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: all 0.15s;
  }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #020F2A; }

  /* MATCH LIST */
  .match-list { padding: 8px 12px 80px; }

  .phase-header {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--text2); text-transform: uppercase;
    padding: 16px 4px 8px;
    border-bottom: 1px solid var(--border); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .phase-header .phase-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }

  .date-group { margin-bottom: 4px; }
  .date-label {
    font-size: 11px; font-weight: 600; color: var(--text2);
    padding: 10px 4px 4px;
  }

  .match-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 6px; cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .match-card:active { transform: scale(0.99); }
  .match-card:hover { border-color: #1A4A7A; }
  .match-card.expanded { border-color: var(--accent); }

  .match-top {
    display: flex; align-items: center; gap: 8px;
  }
  .match-time {
    font-size: 13px; font-weight: 700; color: var(--accent);
    min-width: 42px; text-align: center;
  }
  .match-teams {
    flex: 1; display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600;
  }
  .team-name { flex: 1; }
  .team-name.home { text-align: right; }
  .team-name.away { text-align: left; }
  .vs { color: var(--text2); font-size: 11px; font-weight: 400; flex-shrink: 0; }
  .match-group {
    font-size: 10px; font-weight: 700; color: var(--text2);
    background: rgba(255,255,255,0.05); border-radius: 4px;
    padding: 2px 5px; min-width: 28px; text-align: center;
  }

  .match-details {
    display: none; padding-top: 10px;
    border-top: 1px solid var(--border); margin-top: 10px;
    font-size: 12px; color: var(--text2); line-height: 1.8;
  }
  .match-card.expanded .match-details { display: block; }
  .match-details strong { color: var(--text); }
  .broadcaster-list { margin-top: 4px; }
  .broadcaster-tag {
    display: inline-block; background: rgba(200,168,75,0.15);
    border: 1px solid rgba(200,168,75,0.3); border-radius: 5px;
    padding: 2px 7px; font-size: 11px; font-weight: 600;
    color: var(--accent); margin: 2px 3px 2px 0;
  }
  .broadcaster-tag.free {
    background: rgba(26,140,78,0.15);
    border-color: rgba(26,140,78,0.3);
    color: #4EC880;
  }

  /* FOOTER */
  .footer-note {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    text-align: center; font-size: 10px; color: var(--text2);
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: #1A8C4E; color: #fff; border-radius: 20px;
    padding: 10px 20px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
    z-index: 200;
  }
  .toast.show { opacity: 1; }

  /* Search */
  .search-wrap { padding: 0 12px 8px; }
  .search-input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 9px 14px;
    font-size: 14px; outline: none;
  }
  .search-input::placeholder { color: var(--text2); }
  .search-input:focus { border-color: var(--accent); }

  @media (min-width: 600px) {
    .match-list { max-width: 600px; margin: 0 auto; }
    .download-bar { max-width: 600px; margin: 0 auto; }
    .filter-bar { max-width: 600px; margin: 0 auto; }
    .search-wrap { max-width: 600px; margin: 0 auto; }
  }
</style>
</head>

<header>
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">🏆</div>
      <div class="logo-text">
        <h1 id="title-main">Copa do Mundo 2026</h1>
        <p id="title-sub">EUA · México · Canadá</p>
      </div>

    <button class="install-btn" id="installBtn" onclick="installApp()">⬇ Instalar</button>
  </div>

  <div class="updated-label" id="updatedLabel"></div>
</div>

<div class="search-wrap">

</div>

<div class="footer-note" id="footerNote">

// ============================================================
// TIME UTILS
// ============================================================

function brtToItaly(timeBRT) {
  // Italy CEST = BRT + 5h (UTC-3 → UTC+2)
  const [h, m] = timeBRT.split(':').map(Number);
  let ih = h + 5, nextDay = false;
  if (ih >= 24) { ih -= 24; nextDay = true; }
  return (nextDay ? '+1 ' : '') + String(ih).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function brtToUTC(date, timeBRT) {
  const [y, mo, d] = date.split('-').map(Number);
  const [h, m] = timeBRT.split(':').map(Number);
  let utcH = h + 3;
  let dt = new Date(Date.UTC(y, mo-1, d, utcH, m, 0));
  const pad = n => String(n).padStart(2,'0');
  const Y = dt.getUTCFullYear(), Mo = dt.getUTCMonth()+1, D = dt.getUTCDate();
  const H = dt.getUTCHours(), Mi = dt.getUTCMinutes();
  return `${Y}${pad(Mo)}${pad(D)}T${pad(H)}${pad(Mi)}00Z`;
}

function displayDate(date, lang) {
  const d = new Date(date + 'T12:00:00Z');
  const opts = { weekday:'short', day:'numeric', month:'long' };
  const loc = lang === 'it' ? 'it-IT' : 'pt-BR';
  return d.toLocaleDateString(loc, opts);
}

      res.push({ name: 'SporTV', free: false });
      res.push({ name: 'Globoplay', free: false });
    }
    return res;
  } else {
    const res = [];
    res.push({ name: 'DAZN', free: false });
    if (RAI_IDS.has(id)) {
      res.push({ name: 'Rai 1', free: true });
      res.push({ name: 'RaiPlay', free: true });
    }
    return res;
  }
}

function toggleMatch(id) {
  expandedId = (expandedId === id) ? null : id;
  renderMatches();
}

function renderMatches() {
  const lang = currentLang;
  const filter = currentFilter;
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  let filtered = MATCHES.filter(m => {
    const [id,,, phase, group, hc, ac] = m;
    if (filter !== 'all' && phase !== filter) return false;
    if (q) {
      const hn = name(hc, lang).toLowerCase();
      const an = name(ac, lang).toLowerCase();
      const g = group.toLowerCase();
      if (!hn.includes(q) && !an.includes(q) && !g.includes(q) && !hc.toLowerCase().includes(q) && !ac.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  // Group by phase then date
  const grouped = {};
  const phaseOrder = ['GS','R32','R16','QF','SF','3P','F'];

  filtered.forEach(m => {
    const [,,, phase] = m;
    if (!grouped[phase]) grouped[phase] = {};
    const dateKey = m[1];
    if (!grouped[phase][dateKey]) grouped[phase][dateKey] = [];
    grouped[phase][dateKey].push(m);
  });

  let html = '';
  phaseOrder.forEach(phase => {
    if (!grouped[phase]) return;
    const pLabel = PHASE_LABELS[phase]?.[lang] || phase;
    html += `<div class="phase-header"><span class="phase-dot"></span>${pLabel}</div>`;
    Object.keys(grouped[phase]).sort().forEach(date => {
      html += `<div class="date-group">`;
      html += `<div class="date-label">${displayDate(date, lang)}</div>`;
      grouped[phase][date].forEach(m => {
        const [id, mdate, timeBRT, mphase, group, hc, ac, venue] = m;
        const hName = name(hc, lang);
        const aName = name(ac, lang);
        const hFlag = hc ? flag(hc) : '❓';
        const aFlag = ac ? flag(ac) : '❓';
        const timeDisp = lang === 'it' ? brtToItaly(timeBRT) : timeBRT;
        const gLabel = group || mphase;
        const isExpanded = expandedId === id;
        const broadcasters = getBroadcasters(id, lang);
        const bHtml = broadcasters.map(b =>
          `<span class="broadcaster-tag${b.free?' free':''}">${b.name}${b.free?' ✓':''}</span>`
        ).join('');
        const watchLabel = lang === 'it' ? 'Dove vedere' : 'Onde assistir';
        const venueLabel = lang === 'it' ? 'Stadio' : 'Estádio';

        // Live results
        const res = liveData.results[String(id)] || {};
        const ko = liveData.knockout?.[String(id)] || {};
        const dispHc = ko.hc || hc;
        const dispAc = ko.ac || ac;
        const dispHName = dispHc ? name(dispHc, lang) : hName;
        const dispAName = dispAc ? name(dispAc, lang) : aName;
        const dispHFlag = dispHc ? flag(dispHc) : hFlag;
        const dispAFlag = dispAc ? flag(dispAc) : aFlag;

        let scoreBadge = '';
        if (res.status === 'FT' && res.hs != null) {
          scoreBadge = `<span class="score-badge ft">${res.hs}–${res.as}</span>`;
        } else if (res.status === 'LIVE' && res.hs != null) {
          scoreBadge = `<span class="score-badge live">🔴 ${res.hs}–${res.as}</span>`;
        }
        const liveBadge = res.status === 'LIVE'
          ? `<span class="live-badge">AO VIVO</span>` : '';

        html += `
<div class="match-card${isExpanded?' expanded':''}" onclick="toggleMatch(${id})">
  <div class="match-top">
    <div class="match-time">${liveBadge}${timeDisp}</div>
    <div class="match-teams">
      <span class="team-name home">${dispHFlag} ${dispHName}</span>
      ${scoreBadge || `<span class="vs">vs</span>`}
      <span class="team-name away">${dispAFlag} ${dispAName}</span>
    </div>
    <div class="match-group">${gLabel}</div>
  </div>
  <div class="match-details">
    <div>📍 <strong>${venueLabel}:</strong> ${vname(venue, lang)}</div>
    <div class="broadcaster-list">📺 <strong>${watchLabel}:</strong><br>${bHtml}</div>
  </div>
</div>`;
      });
      html += `</div>`;
    });
  });

  if (!html) {
    html = `<div style="text-align:center;color:var(--text2);padding:40px 20px">
      ${lang === 'it' ? 'Nessun risultato trovato' : 'Nenhum jogo encontrado'}
    </div>`;
  }

  document.getElementById('matchList').innerHTML = html;
}

// ============================================================
// ICS GENERATOR
// ============================================================

function foldLine(line) {
  if (line.length <= 75) return line;
  let result = '', i = 0;
  while (i < line.length) {
    const chunk = line.slice(i, i + (i === 0 ? 75 : 74));
    result += (i > 0 ? '\r\n ' : '') + chunk;
    i += chunk.length;
  }
  return result;
}

function escapeICS(str) {
  return str.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

function downloadICS() {
  const lang = currentLang;
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Copa2026App//Copa do Mundo 2026//PT',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    lang === 'pt'
      ? 'X-WR-CALNAME:⚽ Copa do Mundo 2026'
      : 'X-WR-CALNAME:⚽ Mondiali FIFA 2026',
    lang === 'pt'
      ? 'X-WR-CALDESC:Todos os 104 jogos da Copa do Mundo 2026 com horários e transmissões'
      : 'X-WR-CALDESC:Tutte le 104 partite dei Mondiali FIFA 2026 con orari e canali',
    'X-WR-TIMEZONE:UTC',
    'X-APPLE-CALENDAR-COLOR:#C8A84B',
  ];

  MATCHES.forEach(m => {
    const [id, date, timeBRT, phase, group, hc, ac, venue] = m;
    const hName = name(hc, lang);
    const aName = name(ac, lang);
    const hFlag = hc ? flag(hc) : '';
    const aFlag = ac ? flag(ac) : '';
    const dtStart = brtToUTC(date, timeBRT);
    // End time: +2h (may extend for knockout but 2h is standard)
    const dtEnd = brtToUTC(date, (() => {
      const [h, mi] = timeBRT.split(':').map(Number);
      const eh = h + 2, emi = mi;
      if (eh >= 24) return `${String(eh-24).padStart(2,'0')}:${String(emi).padStart(2,'0')}`;
      return `${String(eh).padStart(2,'0')}:${String(emi).padStart(2,'0')}`;
    })());

    const summary = hc
      ? `${hFlag} ${hName} vs ${aFlag} ${aName}`
      : (lang === 'it' ? `🏆 Mondiali 2026 - ${PHASE_LABELS[phase]?.it || phase}` : `🏆 Copa 2026 - ${PHASE_LABELS[phase]?.pt || phase}`);

    const broadcasters = getBroadcasters(id, lang);
    const bNames = broadcasters.map(b => b.name + (b.free ? ' (grátis)' : '')).join(', ');
    const watchLabel = lang === 'it' ? 'Dove vedere' : 'Onde assistir';
    const groupLabel = group ? (lang === 'it' ? `Gruppo ${group}` : `Grupo ${group}`) : (PHASE_LABELS[phase]?.[lang] || phase);
    const descPT = `🏆 Copa do Mundo FIFA 2026\\n${groupLabel}\\n📍 ${vname(venue, lang)}\\n📺 ${watchLabel}: ${bNames}\\n\\n🌐 EUA · México · Canadá`;
    const descIT = `🏆 Mondiali FIFA 2026\\n${groupLabel}\\n📍 ${vname(venue, lang)}\\n📺 ${watchLabel}: ${bNames}\\n\\n🌐 USA · Messico · Canada`;
    const desc = lang === 'it' ? descIT : descPT;

    lines.push('BEGIN:VEVENT');
    lines.push(foldLine(`UID:wc2026-${id}@copa2026.app`));
    lines.push(foldLine(`DTSTART:${dtStart}`));
    lines.push(foldLine(`DTEND:${dtEnd}`));
    lines.push(foldLine(`SUMMARY:${escapeICS(summary)}`));
    lines.push(foldLine(`DESCRIPTION:${escapeICS(desc)}`));
    lines.push(foldLine(`LOCATION:${escapeICS(vname(venue, lang))}`));
    lines.push('STATUS:CONFIRMED');
    lines.push('TRANSP:TRANSPARENT');
    lines.push('END:VEVENT');
  });

  lines.push('END:VCALENDAR');

  const content = lines.join('\r\n');
  const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = lang === 'it' ? 'mondiali-2026-italia.ics' : 'copa-do-mundo-2026-brasil.ics';
  a.click();
  URL.revokeObjectURL(url);

  showToast(lang === 'it' ? '📅 File .ics scaricato!' : '📅 Arquivo .ics baixado!');
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();

});

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('installBtn').classList.remove('visible');
  });
}
